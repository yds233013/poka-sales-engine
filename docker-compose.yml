services:
  postgres:
    image: postgres:16-alpine
    container_name: poka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: poka
      POSTGRES_PASSWORD: poka
      POSTGRES_DB: poka_sales_engine
    ports:
      - "5433:5432"
    volumes:
      - poka-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poka -d poka_sales_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  poka-pgdata:
